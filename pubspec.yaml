name: enso
description: AI-powered mental wellness companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.3.1
  firebase_app_check: ^0.3.2+5
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.1
  percent_indicator: ^4.2.3
  intl: ^0.20.2
  uuid: ^4.5.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.0
  record: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.2
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/mascots/
